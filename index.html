<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Incognito Pest Control Services</title>

  <style>
    :root {
      --bg: #f7f7f2;
      --green: #2e7d32;
      --green-light: #4caf50;
      --text-dark: #1a1a1a;
      --shadow: rgba(0, 0, 0, 0.1);
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text-dark);
    }

    /* =======================
       FULL PAGE LOADER
    ======================== */
    #loader {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    #loader img {
      width: 140px;
      animation: pulse 1.5s ease-in-out infinite;
    }

    #loader.hide {
      opacity: 0;
      visibility: hidden;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(1); opacity: 0.7; }
    }

    /* =======================
       HEADER
    ======================== */
    header {
      width: 100%;
      height: 45vh;
      min-height: 270px;
      max-height: 430px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    header::before {
      content: "";
      position: absolute;
      inset: 0;
      background: url("incog_banner.png") center / cover no-repeat;
      opacity: 0.25;
    }

    header p {
      position: relative;
      z-index: 2;
      font-size: 22px;
      font-weight: bold;
      text-align: center;
    }

    @media (max-width: 600px) {
      header {
        height: 30vh;
      }
      header p {
        font-size: 18px;
        padding: 0 12px;
      }
    }

    /* =======================
       SERVICES
    ======================== */
    .services-section {
      padding: 20px;
      max-width: 1200px;
      margin: auto;
    }

    .services-title {
      text-align: center;
      font-size: 26px;
      margin-bottom: 25px;
      font-weight: 700;
    }

    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .service-link {
      text-decoration: none;
      color: inherit;
    }

    .service-card {
      position: relative;
      height: 530px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 18px var(--shadow);
      background-size: cover;
      background-position: center;
      transition: transform 0.3s ease;
    }

    .service-card:hover {
      transform: translateY(-6px);
    }

    /* Overlay */
    .service-overlay {
      position: absolute;
      inset: 0;
      background: rgba(20, 60, 35, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .service-card:hover .service-overlay {
      opacity: 1;
    }

    .service-overlay h3 {
      color: #fff;
      font-size: 22px;
      font-weight: bold;
      text-shadow: 0 2px 6px rgba(0,0,0,0.6);
    }

    /* Mobile */
    @media (hover: none) {
      .service-overlay {
        opacity: 1;
        background: rgba(20, 60, 35, 0.55);
      }
    }

    /* Background Images */
    .front-residential { background-image: url('residential-front.png'); }
    .front-commercial { background-image: url('commercial-front.png'); }
    .front-rodent { background-image: url('rodent-front.png'); }
    .front-termite { background-image: url('termite-front.png'); }

    /* =======================
       BUTTON
    ======================== */
    .learn-more-container {
      text-align: center;
      margin-top: 40px;
    }

    .learn-more {
      padding: 12px 28px;
      background: var(--green);
      color: white;
      border-radius: 8px;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
    }

    .learn-more:hover {
      background: var(--green-light);
    }

    /* =======================
       CONTACT
    ======================== */
    .contact-section {
      background: white;
      margin: 60px auto 0;
      padding: 30px;
      max-width: 700px;
      border-radius: 12px;
      box-shadow: 0 6px 24px var(--shadow);
    }

    .contact-section h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .contact-grid {
      display: grid;
      gap: 15px;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button.send-btn {
      padding: 12px;
      border: none;
      background: var(--green);
      color: white;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
    }

    button.send-btn:hover {
      background: var(--green-light);
    }

    .contact-info {
      margin-top: 20px;
      text-align: center;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <!-- LOADER -->
  <div id="loader">
    <img src="incog_logo.png" alt="Incognito Pest Control Logo">
  </div>

  <header>
    <p>A Low Profile But Enviable In Service</p>
  </header>

  <section class="services-section">
    <div class="services-title">Our Services</div>

    <div class="services-grid">

      <a href="services/residential.html" class="service-link">
        <div class="service-card front-residential">
          <div class="service-overlay"><h3>Residential Pest Control</h3></div>
        </div>
      </a>

      <a href="services/commercial.html" class="service-link">
        <div class="service-card front-commercial">
          <div class="service-overlay"><h3>Commercial Pest Control</h3></div>
        </div>
      </a>

      <a href="services/rodent.html" class="service-link">
        <div class="service-card front-rodent">
          <div class="service-overlay"><h3>Rodent Control</h3></div>
        </div>
      </a>

      <a href="services/termite.html" class="service-link">
        <div class="service-card front-termite">
          <div class="service-overlay"><h3>Termite Control</h3></div>
        </div>
      </a>

    </div>
  </section>

  <div class="learn-more-container">
    <a href="https://web.facebook.com/profile.php?id=61556409520594" target="_blank" class="learn-more">Learn More</a>
  </div>

  <section class="contact-section">
    <h2>Contact Us</h2>

    <form action="mailto:yourbusiness@gmail.com" method="post" enctype="text/plain">
      <div class="contact-grid">
        <input type="text" name="name" placeholder="Your Name" required />
        <input type="email" name="email" placeholder="Your Email" required />
        <textarea name="message" placeholder="Your Message" rows="5" required></textarea>
      </div>
      <button class="send-btn" type="submit">Send Message</button>
    </form>

    <div class="contact-info">
      <p><strong>Phone:</strong> 0912-345-6789</p>
      <p><strong>Email:</strong> yourbusiness@gmail.com</p>
      <p><strong>Location:</strong> 97C Pinpin St., Palma, Baguio City, Philippines</p>
    </div>
  </section>

  <script>
    window.addEventListener("load", () => {
      setTimeout(() => {
        document.getElementById("loader").classList.add("hide");
      }, 500);
    });
  </script>

</body>
</html>
