<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Incognito Pest Control Services</title>

  <style>
    :root {
      --bg: #f7f7f2; /* off-white */
      --card: #ffffff;
      --green: #2e7d32;
      --green-light: #4caf50;
      --text-dark: #1a1a1a;
      --shadow: rgba(0, 0, 0, 0.1);
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text-dark);
    }

    header {
      width: 100%;
      min-height: 200px;
      padding: 40px 20px 20px;
      background: #f7f7f2;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    
    header::before {
      content: "";
      position: absolute;
      inset: 0;
      background: url("incog_banner.png") center/contain no-repeat;
      opacity: 0.3;
      pointer-events: none;
    }
    
    header p {
      position: relative;
      z-index: 2;
      font-size: 22px;
      font-weight: bold;
    }
    
    /* Mobile */
    @media (max-width: 600px) {
      header {
        min-height: 150px;
        padding: 20px;
      }
      header p {
        font-size: 18px;
      }
    }

    header img.logo { 
      width: 140px; 
      height: auto; 
      margin-bottom: 20px; 
    }

    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
    }

    .intro {
      text-align: right;
      max-width: 700px;
      margin: 15px auto 40px;
      font-size: 18px;
      color: #333;
    }

    /* SERVICES GRID */
    .services-section {
      padding: 20px;
      max-width: 1200px;
      margin: auto;
    }

    .services-title {
      text-align: center;
      font-size: 26px;
      margin-bottom: 25px;
      font-weight: 700;
    }

    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .service-card {
      perspective: 1000px;
    }

    .service-inner {
      position: relative;
      width: 100%;
      height: 260px;
      transition: transform 0.7s;
      transform-style: preserve-3d;
      will-change: transform;
    }

    .service-card:hover .service-inner {
      transform: rotateY(180deg);
    }

    .service-front, .service-back {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 12px;
      box-shadow: 0 4px 18px var(--shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 18px;
      overflow: hidden;
    }

    /* FRONT CARD — WITH BACKGROUND IMAGE + OVERLAY */
    .service-front {
      position: relative;
      background-size: cover;
      background-position: center;
      overflow: hidden;
      color: white;
      font-weight: bold;
      text-shadow: 0 2px 6px rgba(0,0,0,0.6);
      border-left: 6px solid var(--green);
      padding: 0;
    }

    .service-front::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 1;
    }

    .service-front span {
      position: relative;
      z-index: 2;
      font-size: 20px;
    }

    /* BACK CARD */
    .service-back {
      transform: rotateY(180deg);
      background-size: cover;
      background-position: center;
      color: white;
      font-weight: bold;
      padding: 0 !important;
    }

    /* ASSIGN FRONT BACKGROUND IMAGES */
    .front-residential {
      background-image: url('residential.jpg');
    }

    .front-commercial {
      background-image: url('commercial.jpg');
    }

    .front-rodent {
      background-image: url('rodent.jpg');
    }

    .front-termite {
      background-image: url('termite.jpg');
    }

    /* BUTTON */
    .learn-more-container {
      text-align: center;
      margin-top: 40px;
    }

    .learn-more {
      padding: 12px 28px;
      background: var(--green);
      color: white;
      border-radius: 8px;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
    }

    .learn-more:hover {
      background: var(--green-light);
    }

    /* CONTACT */
    .contact-section {
      background: white;
      margin: 60px auto 0;
      padding: 30px;
      max-width: 700px;
      border-radius: 12px;
      box-shadow: 0 6px 24px var(--shadow);
    }

    .contact-section h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .contact-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button.send-btn {
      padding: 12px;
      border: none;
      background: var(--green);
      color: white;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
    }

    button.send-btn:hover {
      background: var(--green-light);
    }

    .contact-info {
      margin-top: 20px;
      text-align: center;
      font-size: 16px;
    }

  </style>
</head>
<body>

  <header>
    <p class="intro">
      A Low Profile But Enviable In Service
    </p>
  </header>

  <!-- SERVICES -->
  <section class="services-section">
    <div class="services-title">Our Services</div>

    <div class="services-grid">

      <div class="service-card">
        <div class="service-inner">
          <div class="service-front front-residential"><span>Residential Pest Control</span></div>
          <div class="service-back" style="background-image: url('residential.jpg');"></div>
        </div>
      </div>

      <div class="service-card">
        <div class="service-inner">
          <div class="service-front front-commercial"><span>Commercial Pest Control</span></div>
          <div class="service-back" style="background-image: url('commercial.jpg');"></div>
        </div>
      </div>

      <div class="service-card">
        <div class="service-inner">
          <div class="service-front front-rodent"><span>Rodent Control</span></div>
          <div class="service-back" style="background-image: url('rodent.jpg');"></div>
        </div>
      </div>

      <div class="service-card">
        <div class="service-inner">
          <div class="service-front front-termite"><span>Termite Control</span></div>
          <div class="service-back" style="background-image: url('termite.jpg');"></div>
        </div>
      </div>

    </div>
  </section>

  <!-- LEARN MORE -->
  <div class="learn-more-container">
    <a href="https://web.facebook.com/profile.php?id=61556409520594" target="_blank" class="learn-more">Learn More</a>
  </div>

  <!-- CONTACT -->
  <section class="contact-section">
    <h2>Contact Us</h2>

    <form action="mailto:yourbusiness@gmail.com" method="post" enctype="text/plain">
      <div class="contact-grid">
        <input type="text" name="name" placeholder="Your Name" required />
        <input type="email" name="email" placeholder="Your Email" required />
        <textarea name="message" placeholder="Your Message" rows="5" required></textarea>
      </div>
      <button class="send-btn" type="submit">Send Message</button>
    </form>

    <div class="contact-info">
      <p><strong>Phone:</strong> 0912-345-6789</p>
      <p><strong>Email:</strong> yourbusiness@gmail.com</p>
      <p><strong>Location:</strong> 97C Pinpin St., Palma, Baguio City, Philippines</p>
    </div>
  </section>

</body>
</html>
